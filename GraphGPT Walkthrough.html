<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>GraphGPT Walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one chapter at a time on a dark "signal" stage; explanation rail on the left, live diagram on the right.
   Red = graph side / trained / the target paper. Blue = language side / frozen / words. Same code as the slide deck. */
:root {
  color-scheme: dark;
  --bg: #070916; --bg2: #0B0E22; --panel: #10142C; --panel2: #151A38; --line: #262D55; --grid: rgba(110,130,255,.07);
  --fg: #E9EDF8; --hi: #F6F7FD; --muted: #A6B0CC; --dim: #7F8AA8;
  --red: #F2385A; --red2: #FF6B84; --redbg: rgba(242,56,90,.14);
  --blue: #4C8DFF; --blue2: #8DB6FF; --bluebg: rgba(76,141,255,.14);
  --violet: #B65CFF; --gray: #8A94AD; --good: #4C8DFF; --bad: #F2385A;
  --grad: linear-gradient(90deg, #FF4D6A 0%, #B65CFF 50%, #5B9BFF 100%);
  --f-display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --gut-l: max(16px, env(safe-area-inset-left, 0px)); --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 400 16px/1.55 var(--f-body); overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg2); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue2); outline-offset: 2px; border-radius: 6px; }
a { color: var(--blue2); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.c-red { color: var(--red2); } .c-blue { color: var(--blue2); } .c-muted { color: var(--muted); } .c-dim { color: var(--dim); } .c-violet { color: #CFA2FF; }
b, strong { color: var(--hi); font-weight: 600; }

#app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }
.bar { display: flex; align-items: center; gap: 12px; padding-left: var(--gut-l); padding-right: var(--gut-r); padding-block: 10px; background: rgba(11,14,34,.92); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); position: relative; z-index: 3; }
.bar.foot { border-top: 1px solid var(--line); border-bottom: 0; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; font: 700 15px var(--f-display); letter-spacing: .08em; white-space: nowrap; cursor: pointer; background: none; border: 0; padding: 0; }
.mark { width: 26px; height: 26px; position: relative; flex: none; }
.mark i { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 8px var(--blue); }
.mark i:nth-child(1) { left: 9px; top: 9px; background: var(--red); box-shadow: 0 0 10px var(--red); }
.mark i:nth-child(2) { left: 0; top: 0; } .mark i:nth-child(3) { right: 0; top: 2px; } .mark i:nth-child(4) { left: 4px; bottom: 0; }
.mark::before { content: ""; position: absolute; inset: 3px; border: 1px solid rgba(141,182,255,.45); border-radius: 50%; }
.secnav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
.secnav::-webkit-scrollbar { display: none; }
.secnav button { background: none; border: 0; padding: 7px 11px; border-radius: 8px; color: var(--muted); font: 500 13px var(--f-body); white-space: nowrap; cursor: pointer; position: relative; }
.secnav button:hover { color: var(--hi); background: var(--panel); }
.secnav button[aria-current="true"] { color: var(--hi); }
.secnav button[aria-current="true"]::after { content: ""; position: absolute; left: 11px; right: 11px; bottom: 1px; height: 2px; border-radius: 2px; background: var(--grad); }
.bar-r { display: flex; gap: 6px; align-items: center; flex: none; flex-wrap: wrap; justify-content: flex-end; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: 600 12px var(--f-mono); letter-spacing: .02em; cursor: pointer; white-space: nowrap; transition: border-color .15s, background .15s; }
.btn:hover { border-color: #3A4479; background: var(--panel2); }
.btn[aria-pressed="true"] { border-color: var(--blue); background: var(--bluebg); color: var(--hi); }
.btn.primary { background: linear-gradient(90deg, #E0294C, #B0306E); border-color: transparent; color: #fff; box-shadow: 0 0 18px rgba(242,56,90,.28); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .4; cursor: default; }
.seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 2px; background: var(--bg2); }
.seg .btn { border: 0; background: transparent; padding: 5px 10px; }
.seg .btn[aria-pressed="true"] { background: var(--panel2); color: var(--hi); box-shadow: inset 0 0 0 1px var(--blue); }
.crumbbar { display: flex; justify-content: space-between; gap: 12px; padding-left: var(--gut-l); padding-right: var(--gut-r); padding-block: 6px; font: 500 12px var(--f-mono); color: var(--dim); background: var(--bg2); border-bottom: 1px solid rgba(38,45,85,.6); }
.crumbbar #crumb { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog { flex: 1; height: 4px; border-radius: 4px; background: var(--panel2); overflow: hidden; }
#progFill { height: 100%; width: 0; background: var(--grad); transition: width .35s ease; box-shadow: 0 0 10px rgba(242,56,90,.6); }
#count { color: var(--muted); font-size: 12px; min-width: 56px; text-align: center; }

#stage { overflow-y: auto; overflow-x: hidden; position: relative; background:
  radial-gradient(1100px 600px at 92% -10%, rgba(76,141,255,.16), transparent 60%),
  radial-gradient(900px 520px at -8% 110%, rgba(242,56,90,.14), transparent 60%),
  repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 64px),
  repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 64px), var(--bg); }
.slide { max-width: 1280px; margin: 0 auto; padding-left: var(--gut-l); padding-right: var(--gut-r); padding-block: 28px 40px; display: flex; flex-direction: column; gap: 22px; animation: rise .45s cubic-bezier(.2,.7,.2,1); }
@keyframes rise { from { transform: translateY(10px); } to { transform: none; } }
.sh { display: flex; flex-direction: column; gap: 6px; max-width: 980px; }
.kicker { font: 600 12px var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--red2); }
.sh h2 { margin: 0; font: 600 clamp(26px, 3.3vw, 40px)/1.12 var(--f-display); letter-spacing: -.02em; color: var(--hi); text-wrap: balance; }
.sh .dq { color: var(--muted); font-size: 17px; margin: 2px 0 0; max-width: 70ch; }
.sb { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 28px; align-items: start; }
.split.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.rail { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.rail p { margin: 0; max-width: 62ch; color: var(--fg); }
.lede { font-size: 18px; color: var(--hi); }
.viz { position: relative; background: linear-gradient(180deg, rgba(21,26,56,.88), rgba(13,16,38,.92)); border: 1px solid var(--line); border-radius: 16px; padding: 38px 16px 16px; min-width: 0; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04); }
.vtag { position: absolute; left: 16px; top: 12px; font: 600 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.vtag .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); margin-right: 6px; box-shadow: 0 0 8px var(--red); animation: pulse 1.6s infinite; vertical-align: 1px; }
@keyframes pulse { 50% { opacity: .35; } }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ctl { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.ctl input[type=range] { accent-color: var(--red); width: 160px; max-width: 100%; }
.ctl output { color: var(--hi); min-width: 44px; font-size: 13px; }
.ctl.chk input { accent-color: var(--red); width: 16px; height: 16px; }
.sel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.stepn { font-size: 12px; margin-left: 4px; }

.card { background: rgba(16,20,44,.85); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card h3, .card h4 { margin: 0; font: 600 18px/1.25 var(--f-display); color: var(--hi); }
.card p { margin: 0; color: var(--muted); font-size: 15px; }
.card.red { background: var(--redbg); border-color: rgba(242,56,90,.4); }
.card.blue { background: var(--bluebg); border-color: rgba(76,141,255,.4); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.tile .tl { font: 600 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.tile .tv { font: 600 24px/1.2 var(--f-display); color: var(--hi); font-variant-numeric: tabular-nums; }
.tile .ts { font-size: 12px; color: var(--muted); }
.tile.red { border-color: rgba(242,56,90,.5); box-shadow: inset 0 0 24px rgba(242,56,90,.12); } .tile.red .tv { color: var(--red2); }
.tile.blue { border-color: rgba(76,141,255,.5); box-shadow: inset 0 0 24px rgba(76,141,255,.12); } .tile.blue .tv { color: var(--blue2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); font: 600 12px var(--f-mono); color: var(--muted); background: var(--bg2); }
.chip.t { color: #FFD0D8; border-color: rgba(242,56,90,.6); background: var(--redbg); }
.chip.f { color: #CFE0FF; border-color: rgba(76,141,255,.6); background: var(--bluebg); }
.chip.t::before, .chip.f::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.eq { font: 400 19px/1.6 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif; color: var(--hi); background: rgba(7,9,22,.6); border: 1px solid var(--line); border-left: 3px solid var(--violet); border-radius: 10px; padding: 12px 16px; overflow-x: auto; white-space: nowrap; }
.eq .tag { font: 600 11px var(--f-mono); color: var(--dim); letter-spacing: .1em; margin-right: 12px; vertical-align: 2px; }
.eq i { font-style: italic; } .eq .r { color: var(--red2); } .eq .b { color: var(--blue2); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
.src { font: 500 12px/1.5 var(--f-mono); color: var(--dim); }
.callout { border-radius: 12px; padding: 12px 16px; background: var(--redbg); border: 1px solid rgba(242,56,90,.45); color: var(--fg); font-size: 15px; }
.callout.blue { background: var(--bluebg); border-color: rgba(76,141,255,.45); }
.quote { border-left: 3px solid var(--red); padding: 4px 0 4px 14px; color: var(--fg); font-style: italic; margin: 0; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs .btn { border: 0; border-radius: 8px 8px 0 0; background: transparent; color: var(--muted); padding: 8px 12px; border-bottom: 2px solid transparent; }
.tabs .btn[aria-selected="true"] { color: var(--hi); border-bottom-color: var(--red); background: rgba(242,56,90,.07); }
.tw { overflow-x: auto; min-width: 0; }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; font: 600 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 8px 10px; border-bottom: 1px solid rgba(38,45,85,.55); }
table.t td.n, table.t th.n { text-align: right; font-family: var(--f-mono); }
table.t tr.hl td { background: rgba(242,56,90,.10); }
.eng-only { display: none !important; }
body.eng .eng-only { display: revert !important; }
body.eng .eng-only.card, body.eng .eng-only.callout { display: flex !important; }
.myth-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.sf { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; }
.notice { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; color: var(--muted); }
.notice > span { flex: none; font: 600 10.5px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--blue2); border: 1px solid rgba(76,141,255,.5); border-radius: 6px; padding: 3px 7px; margin-top: 1px; }
.notice.myth > span { color: var(--red2); border-color: rgba(242,56,90,.5); }

/* SVG flow primitive */
svg.flow { width: 100%; height: auto; display: block; overflow: visible; }
.fb { fill: rgba(255,255,255,.02); stroke: var(--line); stroke-dasharray: 4 5; }
.fb.red { fill: rgba(242,56,90,.05); stroke: rgba(242,56,90,.45); } .fb.blue { fill: rgba(76,141,255,.05); stroke: rgba(76,141,255,.45); }
.fbl { font: 600 11px var(--f-mono); letter-spacing: .12em; fill: var(--dim); text-transform: uppercase; }
.fbl.red { fill: var(--red2); } .fbl.blue { fill: var(--blue2); }
.fn rect { fill: var(--panel); stroke: #34407A; stroke-width: 1.4; transition: fill .25s, stroke .25s, filter .25s; }
.fn.red rect { stroke: rgba(242,56,90,.75); } .fn.blue rect { stroke: rgba(76,141,255,.75); }
.fn.on rect { fill: #1B2150; stroke: var(--hi); filter: drop-shadow(0 0 10px rgba(141,182,255,.75)); }
.fn.red.on rect { fill: #3A1530; stroke: var(--red2); filter: drop-shadow(0 0 12px rgba(242,56,90,.85)); }
.fn.sel rect { stroke: var(--hi); stroke-width: 2.2; }
.fn.dim { opacity: .35; }
.fnt { font: 600 14px var(--f-display); fill: var(--hi); text-anchor: middle; pointer-events: none; }
.fns { font: 500 11px var(--f-mono); fill: var(--muted); text-anchor: middle; pointer-events: none; }
.fe { stroke: #34407A; stroke-width: 1.6; fill: none; }
.fe.on { stroke: var(--red2); stroke-dasharray: 6 6; animation: dash 0.8s linear infinite; }
.fe.blue.on { stroke: var(--blue2); }
@keyframes dash { to { stroke-dashoffset: -12; } }
.pk { fill: #FFC2CD; filter: drop-shadow(0 0 6px #FF4D6A); } .pk.b { fill: #D6E5FF; filter: drop-shadow(0 0 6px #5B9BFF); }
.gnode circle { transition: r .2s, opacity .2s; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: center; padding-top: 12px; }
.hero h1 { margin: 6px 0 0; font: 700 clamp(64px, 10vw, 132px)/0.95 var(--f-display); letter-spacing: -.045em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 30px rgba(182,92,255,.25)); }
.hero .sub { font: 500 clamp(20px, 2.4vw, 28px)/1.25 var(--f-display); color: var(--hi); margin: 6px 0 0; text-wrap: balance; }
.hero .auth { color: var(--muted); margin: 0; font-size: 15px; }
.hero .q { font: 500 19px/1.4 var(--f-display); color: var(--hi); background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 16px 18px; box-shadow: 0 0 40px rgba(242,56,90,.15); margin: 0; }
.herocv { position: relative; aspect-ratio: 1 / 1; max-width: 100%; width: 100%; max-height: 560px; }
.herocv::before { content: ""; position: absolute; inset: 6%; border-radius: 50%; background: radial-gradient(circle, rgba(242,56,90,.28), rgba(76,141,255,.10) 45%, transparent 70%); }
.herocv .cap { position: absolute; left: 0; right: 0; bottom: -4px; text-align: center; font: 500 12px var(--f-mono); color: var(--dim); }
.route { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.route button { text-align: left; background: rgba(16,20,44,.8); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; transition: border-color .2s, transform .2s; }
.route button:hover { border-color: var(--red); transform: translateY(-2px); }
.route .rk { font: 600 11px var(--f-mono); color: var(--red2); letter-spacing: .1em; }
.route .rt { font: 600 16px var(--f-display); color: var(--hi); }
.route .rs { font-size: 12.5px; color: var(--muted); }

/* token strip */
.tokrow { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.tk { font: 500 13px var(--f-mono); padding: 5px 8px; border-radius: 6px; border: 1px solid rgba(76,141,255,.45); background: var(--bluebg); color: #D6E5FF; cursor: default; }
.tk.g { border-color: rgba(242,56,90,.7); background: var(--redbg); color: #FFD0D8; cursor: pointer; box-shadow: 0 0 10px rgba(242,56,90,.25); }
.tk.g.on { background: var(--red); color: #fff; }
.tk.m { border-style: dashed; border-color: rgba(182,92,255,.7); background: rgba(182,92,255,.12); color: #E6D1FF; }
.pbar { height: 22px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); position: relative; overflow: hidden; }
.pbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--grad); box-shadow: 0 0 14px rgba(242,56,90,.7); transition: width .6s cubic-bezier(.2,.7,.2,1); }
.hbar { display: grid; grid-template-columns: 150px minmax(0,1fr) 64px; gap: 10px; align-items: center; font-size: 13px; }
.hbar .tr { height: 26px; border-radius: 6px; background: rgba(255,255,255,.03); display: flex; overflow: hidden; }
.hbar .tr i { display: block; height: 100%; transition: width .5s; }

/* matrix */
.mx { border-collapse: separate; border-spacing: 3px; font: 500 13px var(--f-mono); }
.mx td, .mx th { width: 34px; height: 30px; text-align: center; border-radius: 6px; }
.mx th { color: var(--dim); font-weight: 600; }
.mx td { background: rgba(255,255,255,.04); color: var(--dim); transition: background .2s, color .2s; }
.mx td.one { color: var(--hi); background: rgba(76,141,255,.22); }
.mx tr.hl td { outline: 1px solid rgba(242,56,90,.55); }
.mx tr.hl td.one { background: var(--red); color: #fff; box-shadow: 0 0 12px rgba(242,56,90,.6); }
.mx td.col { outline: 1px solid rgba(141,182,255,.55); }
.hm td.cell { text-align: center; font-family: var(--f-mono); font-weight: 600; border-radius: 6px; min-width: 64px; color: var(--hi); }

/* matching game */
.match { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.mrow { display: grid; grid-template-columns: 54px minmax(0,1fr); gap: 10px; align-items: center; }
.mrow .gt { font: 600 14px var(--f-mono); text-align: center; padding: 8px 0; border-radius: 8px; background: var(--redbg); border: 1px solid rgba(242,56,90,.6); color: #FFD0D8; }
.mrow select { width: 100%; min-width: 0; }
.mrow.ok select { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
.mrow.no select { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }

/* Q&A */
details.qa { background: rgba(16,20,44,.85); border: 1px solid var(--line); border-radius: 12px; padding: 0 16px; }
details.qa summary { cursor: pointer; padding: 12px 0; font: 600 15.5px var(--f-display); color: var(--hi); list-style: none; display: flex; gap: 10px; }
details.qa summary::before { content: "+"; font-family: var(--f-mono); color: var(--red2); width: 14px; flex: none; }
details.qa[open] summary::before { content: "−"; }
details.qa p { margin: 0 0 14px 24px; color: var(--muted); max-width: 80ch; }
.qmeta { font: 600 11px var(--f-mono); color: var(--dim); letter-spacing: .08em; text-transform: uppercase; margin-left: auto; padding-left: 10px; white-space: nowrap; }

/* overlays */
